<head>

<title>データサイエンス 学習ハブ</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1e293b;--sub:#64748b;--line:#e2e8f0;--acc:#2563eb;--ok:#16a34a;--star:#f59e0b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--ink:#e2e8f0;--sub:#94a3b8;--line:#334155;--acc:#60a5fa}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.6}
.hero{background:linear-gradient(135deg,#1e293b,#1d4ed8 55%,#7c3aed);color:#fff;padding:2.2rem 16px 4.5rem;text-align:center}
.hero h1{margin:0 0 .4rem;font-size:1.9rem}.hero p{margin:0;opacity:.9;font-size:.95rem}
.wrap{max-width:1100px;margin:-3rem auto 3rem;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;box-shadow:0 4px 14px rgba(0,0,0,.06);margin-bottom:1rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
input[type=search]{flex:1;min-width:200px;padding:.65rem .9rem;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:.35rem .85rem;font-size:.85rem;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:.55rem 1rem;font-size:.9rem;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:var(--star)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.8rem}
.pc{background:var(--bg);border-radius:12px;padding:.7rem .9rem}.pc b{font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:.4rem}.bar i{display:block;height:100%;background:var(--ok)}
.pc small{color:var(--sub)}
h2.mod{margin:1.6rem 0 .6rem;font-size:1.05rem;border-left:4px solid var(--acc);padding-left:.6rem}
.cname{margin:2rem 0 0;font-size:1.3rem}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:.7rem}
.it{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.75rem .9rem;display:flex;flex-direction:column;gap:.3rem}
.it.done{opacity:.62}.it .tt{font-weight:700}.it .tt a{color:inherit;text-decoration:none}.it .tt a:hover{color:var(--acc)}
.it .tg{font-size:.72rem;color:var(--sub)}.it .ds{font-size:.82rem;color:var(--sub)}
.acts{display:flex;gap:.4rem;margin-top:.2rem;flex-wrap:wrap}
.acts a,.acts button{font-size:.78rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:.2rem .6rem;cursor:pointer;text-decoration:none}
.acts .on-done{background:var(--ok);color:#fff;border-color:var(--ok)}.acts .on-star{background:var(--star);color:#fff;border-color:var(--star)}
.none{text-align:center;color:var(--sub);padding:2rem}
@media(max-width:600px){.hero h1{font-size:1.4rem}}
</style>
</head>

 </div>

ples_easy.html", "practice": false}, {"id": "alias.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "🏷️", "title": "列の別名（AS）", "tag": "M4 · Aliasing columns", "desc": "計算で作った列に名前を付ける。ORDER BYでは別名が使えて、WHEREでは使えない理由。", "easy": "alias_easy.html", "practice": false}, {"id": "math_columns.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "➗", "title": "列の計算 — 四則演算とパーセント変化", "tag": "M4 · Math and columns", "desc": "列同士の計算、演算の順序とカッコ、パーセント変化 (新−旧)÷旧、CASTでの整形、NULLの除外。", "easy": "math_columns_easy.html", "practice": false}, {"id": "aggregate.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "📊", "title": "集計関数 — AVG・SUM と GROUP BY", "tag": "M4 · Aggregate function", "desc": "複数行を1つの値にまとめる関数。GROUP BYが必須になる理由、Excelとの比較、WHEREでは使えないという制約。", "easy": "aggregate_easy.html", "practice": false}, {"id": "max_min.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "📈", "title": "MAX と MIN — 値の範囲を知る", "tag": "M4 · Max and min", "desc": "最大値・最小値を求めるだけでなく、2つ合わせて「データが取りうる範囲」を把握し、外れ値を見つける。", "easy": "max_min_easy.html", "practice": false}, {"id": "group_by.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "🗂️", "title": "GROUP BY — 集計を切り分ける", "tag": "M4 · Group by", "desc": "1つの集計値を列の値ごとの内訳に分解。非集計列は全部GROUP BYへ、というルールと、複数列の順番で変わる切り口。", "easy": "group_by_easy.html", "practice": false}, {"id": "sum.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "➕", "title": "SUM — 合計と集計関数の組み合わせ", "tag": "M4 · Sum", "desc": "GROUP BYが要らないケース、WHEREで条件付きの合計、SUMとCOUNTを並べて「1件あたりいくら」を読み取る。", "easy": "sum_easy.html", "practice": false}, {"id": "having.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "🚦", "title": "HAVING — 集計後のフィルタ", "tag": "M4 · Having", "desc": "WHEREは集計前、HAVINGは集計後。GROUP BYの後に書くルールと、リピーター／新規顧客を切り分ける実例。", "easy": "having_easy.html", "practice": false}, {"id": "percentiles.html", "course": "sql", "mod": "➗ M4 — 計算と集計", "icon": "📐", "title": "公式マニュアルを読む — パーセンタイルと最頻値", "tag": "M4+ · Percentile and mode", "desc": "組み込みのMEDIAN()は存在しないという事実から、公式マニュアル§9.21を読み解く。mode・ 義・順序・間隔・比率）と、数字で書かれたカテゴリのわな、離散と連続の違いを整理します。", "easy": null, "practice": false}, {"id": "stats/m1_rbasics.html", "course": "stats", "mod": "550 M1 R入門と測定水準", "icon": "🧮", "title": "R の基本：電卓・代入・変数名", "tag": "M1 · R Introduction — RStudio, R as a Calculator, Assignment, Naming, Math Functions", "desc": "R と RStudio の役割分担から始めて、R を電卓として使う、<- で値を保存する、変数名のルールと習慣、sqrt() や round() などの関数と引数までを学びます。", "easy": null, "practice": false}, {"id": "stats/m1_vectors.html", "course": "stats", "mod": "550 M1 R入門と測定水準", "icon": "🔢", "title": "ベクトル：まとめて計算・型・取り出し", "tag": "M1 · R Introduction — Vectors, Vectorized Operations, Data Types & Indexing", "desc": "R の基本単位はベクトル（同じ型の値の並び）です。c() で作り、まとめて計算（ベクトル化演算）し、文字・論理値も扱い、[ ] で番号や条件で取り出すところまで進みます。", "easy": null, "practice": false}, {"id": "stats/m1_workflow.html", "course": "stats", "mod": "550 M1 R入門と測定水準", "icon": "🗂️", "title": "作業ディレクトリ・コメント・パッケージ・環境の整理", "tag": "M1 · R Introduction — Working Directory, Comments, Packages & Cleaning Your Environment", "desc": "R がどのフォルダを見ているか（作業ディレクトリ）、未来の自分のためのコメント、機能を追加するパッケージの「インストール」と「読み込み」の違い、そして環境の掃除を学びます。", "easy": null, "practice": false}, {"id": "stats/m1_dataframe.html", "course": "stats", "mod": "550 M1 R入門と測定水準", "icon": "🧾", "title": "データフレーム：作る・取り出す・調べる・CSV を読む", "tag": "M1 · Data Frames in R — Intro, Accessing Data, Analyzing a Data Frame & Loading a CSV", "desc": "ばらばらのベクトルを1つの表にまとめるのがデータフレームです。data.frame() で作り、$ と [行, 列] で取り出し、dim()・str()・summary() で調べ、最後に read.csv() で donors.csv を読み込みます。", "easy": null, "practice": false}, {"id": "stats/m2_center.html", "course": "stats", "mod": "550 M2 記述統計", "icon": "🎯", "title": "中心の指標：平均・中央値・トリム平均・最頻値", "tag": "M2 · Measures of Center — Mean, Statistics vs Parameters, Median, Trimmed Mean & Mode", "desc": "データの「真ん中」を1つの数で表す方法を比べます。平均と na.rm = TRUE、統計量と母数（標本と母集団）、外れ値に強い中央値、その中間のトリム平均、形を示す最頻値です。", "easy": null, "practice": false}, {"id": "stats/m2_graphs.html", "course": "stats", "mod": "550 M2 記述統計", "icon": "📊", "title": "基本のグラフ：ヒストグラム・ドット／幹葉・棒グラフ", "tag": "M2 · Basic Graphs — Describing Shape with Histograms, Dotplots & Stemplots, Barplots for Categorical Data", "desc": "グラフの選び方はデータの種類で決まります。量的データにはヒストグラム・ドットプロット・幹葉図、カテゴリには度数表と棒グラフ。分布の形（右に歪む・左に歪む・左右対称）の読み方も学びます。", "easy": null, "practice": false}, {"id": "stats/m2_spread.html", "course": "stats", "mod": "550 M2 記述統計", "icon": "📦", "title": "5数要約・箱ひげ図・範囲と IQR・外れ値", "tag": "M2 · Measures of Spread — Five-Number Summary, Boxplots, Range & IQR, Outliers with 1.5(IQR)", "desc": "平均が同じでも、ばらつきが違えば別のデータです。5数要約と四分位数、それを絵にした箱ひげ図、ばらつきの指標範囲と IQR、そして1.5×IQR ルールで外れ値を決める方法を学びます。", "easy": null, "practice": false}, {"id": "stats/m2_sd_normal.html", "course": "stats", "mod": "550 M2 記述統計", "icon": "🔔", "title": "標準偏差・正規分布・経験則・歪度と尖度", "tag": "M2 · The Standard Deviation, Normal Distributions & the Empirical Rule, Connecting Center & Spread, Kurtosis & Skew", "desc": "もっとも重要なばらつきの指標標準偏差を、手順を追って計算します（母集団と標本で割る数が違う理由も）。次に正規分布と 68-95-99.7 の経験則、中心とばらつきから形を推理する方法、歪度・尖度を学びます。", "easy": null, "practice": false}, {"id": "stats/m2_z.html", "course": "stats", "mod": "550 M2 記述統計", "icon": "⚖️", "title": "z スコア：単位の違うデータを比べる", "tag": "M2 · Standardized Scores (z-scores), Using z-scores & Descriptive Statistics Conclusion", "desc": "点数の満点も単位も違うテストで、どちらが「良かった」かを比べるには標準化が必要です。z スコアの計算と解釈、データ全体の標準化、そして「記述統計は描写してこそ」というまとめで M2 を締めくくります。", "easy": null, "practice": false}, {"id": "stats/m3_prob.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "🎲", "title": "確率の基本：標本空間・事象・確率とオッズ", "tag": "M3 · Probability — Probability Terms, Probability & Odds, the Law of Large Numbers", "desc": "確率の言葉（ランダムな試行・標本空間・事象）を R の sample() で体験し、確率とオッズの違い、たくさんくり返すと割合が確率に近づく大数の法則を学びます。", "easy": null, "practice": false}, {"id": "stats/m3_cond.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "🔗", "title": "余事象・和と積・加法定理・条件付き確率・独立", "tag": "M3 · Probability — Complements, Intersections & Unions, the General Addition Rule, Conditional Probability, Independent Events", "desc": "架空のオンラインショップの二元表を使って、余事象、積（かつ）と和（または）、加法定理、排反、条件付き確率、独立を順に計算します。最後に「排反」と「独立」の違いを整理します。", "easy": null, "practice": false}, {"id": "stats/m3_bayes.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "🧠", "title": "頻度論とベイズ：確率の2つの考え方", "tag": "M3 · Probability — The Frequentist Approach, the Bayesian Approach, Frequentist vs. Bayesian in A/B Testing", "desc": "確率には2つの解釈があります。長い目で見た相対度数とみなす頻度論と、信念の度合いとみなすベイズです。それぞれの長所・短所と、ベイズの定理の計算（検査の陽性の例）を学びます。", "easy": null, "practice": false}, {"id": "stats/m3_discrete.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "🧮", "title": "確率変数と離散分布：一様・二項・幾何・ポアソン", "tag": "M3 · Probability Distributions — Random Variables, Uniform, Binomial Probabilities & Distributions, Geometric, Poisson", "desc": "結果を数で表した確率変数（離散と連続）、R の分布関数の4つの接頭辞 r・d・p・q、そして一様・二項・幾何・ポアソンの4つの分布を、使える条件と R の計算でまとめます。", "easy": null, "practice": false}, {"id": "stats/m3_normal.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "🔔", "title": "正規分布：pnorm・qnorm と二項／ポアソンの正規近似", "tag": "M3 · Probability Distributions — Normal Distributions, Modeling Binomial & Poisson with Normal Curves", "desc": "連続分布の代表正規分布で、「〜以下」「〜以上」「〜の間」の確率を pnorm()、パーセンタイルを qnorm() で求めます。さらに、二項分布やポアソン分布を正規分布で近似できる条件と、標準正規分布を学びます。", "easy": null, "practice": false}, {"id": "stats/m3_tchif.html", "course": "stats", "mod": "550 M3 確率と分布", "icon": "📐", "title": "t 分布・χ² 分布・F 分布", "tag": "M3 · Probability Distributions — T Distributions, Chi-square Distributions, F Distribution", "desc": "推測統計の主役になる3つの連続分布です。母標準偏差がわからないときの t 分布（自由度・重い裾・臨界値）、正規乱数の2乗和からできる χ² 分布、2つの χ² の比である F 分布を、R の pt/qt・pchisq・pf とシミュレーションで理解します。", "easy": null, "practice": false}, {"id": "stats/m3_basics.html", "course": "stats", "mod": "550 M4 推測の基礎（仮説検定・信頼区間）", "icon": "🎯", "title": "推測の基礎①：データ収集と帰無仮説", "tag": "M4 · Foundations of Inference ① — Data Collection &amp; the Null Hypothesis", "desc": "統計の推測は、どうデータを集めたかで決まります。まず母集団と標本・偏り・観察研究と実験を学び、そのうえで「真であることは証明できない」という反証（falsification）の考え方から、帰無仮説と対立仮説が生まれる理由を理解します。 ·", "easy": "stats/m3_basics_easy.html", "practice": false}, {"id": "stats/m3_testing.html", "course": "stats", "mod": "550 M4 推測の基礎（仮説検定・信頼区間）", "icon": "🎯", "title": "推測の基礎②：片側／両側検定・α・第1種／第2種の誤り", "tag": "M4 · Inference Foundations ② — Tails, the α Level &amp; Type I / II Errors", "desc": "仮説検定の「ルール」を決める3つの道具を学びます。どちらの端を見るか（片側・両側）、どこから「珍しい」と呼ぶか（有意水準 α = 0.05 の由来）、そして検定が間違うとき、どんな間違い方があるか（第1種・第2種の誤り）です。 ·", "easy": "stats/m3_testing_easy.html", "practice": false}, {"id": "stats/m3_estimation.html", "course": "stats", "mod": "550 M4 推測の基礎（仮説検定・信頼区間）", "icon": "📏", "title": "推測の基礎③：標準誤差・信頼区間・効果量と検出力", "tag": "M4 · Foundations of Inference ③ — Standard Error, Confidence Interval, Effect Size &amp; Power", "desc": "標本は母集団そのものではないので、取るたびに結果がゆれます。このレッスンでは、そのゆれを測る標準誤差（SE）と中心極限定理（CLT）、ゆれを考慮して母平均の範囲を示す信頼区間（CI）、そして p 値だけでは分からない効果量と検出力を学… ·", "easy": "stats/m3_estimation_easy.html", "practice": false}, {"id": "stats/m5_t_intro.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "🧪", "title": "t手順①：1標本の平均の推測", "tag": "M5 · T Procedures ① — Inference for One Mean", "desc": "標本の平均から、未知の母平均について何が言えるか。信頼区間（confidence interval）で範囲を推定し、有意性検定（significance test）で仮説を確かめる、推測統計の入口です。 ·", "easy": "stats/m5_t_intro_easy.html", "practice": false}, {"id": "stats/m5_t_two.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "⚖️", "title": "t手順②：2標本の区間・検定と対応ありデータ", "tag": "M5 · t Procedures ② — Two Samples &amp; Paired Data", "desc": "2つのグループの平均の差を、信頼区間（Welch の自由度）と有意性検定で調べます。最後に、同じ個体を2回測る対応あり（paired）データでは、差を作って1標本 t にする、という考え方を学びます。 ·", "easy": "stats/m5_t_two_easy.html", "practice": false}, {"id": "stats/m5_t_cond.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "✅", "title": "t手順③：条件・ブートストラップ・有意性", "tag": "M5 · t Procedures ③ — Conditions, Bootstrap &amp; Significance", "desc": "t 検定・t 区間は、使ってよい条件が満たされているときにだけ信頼できます。この回では、条件のチェックリストと、条件が怪しいときの代案であるブートストラップ t 信頼区間、そして p 値を使うときの注意（統計的有意性と実用的有意性、p… ·", "easy": "stats/m5_t_cond_easy.html", "practice": false}, {"id": "stats/m5_anova_concept.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "📊", "title": "M5 ANOVA①：考え方と仕組み", "tag": "M5 · Inference — ANOVA (1)", "desc": "3つ以上のグループの平均を比べたいとき、t 検定を何回も繰り返してはいけません。そこで登場するのが分散分析（ANOVA）。「グループ間のばらつき ÷ グループ内のばらつき」という比（F）で一度に判断します。 ·", "easy": "stats/m5_anova_concept_easy.html", "practice": false}, {"id": "stats/m5_anova_calc.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "🧮", "title": "ANOVA②：RでのANOVAと計算", "tag": "M5 · ANOVA ② — ANOVA in R &amp; the Calculation", "desc": "3つの減量プランの比較データを R に入力し、aov() と summary() で分散分析表を読み、pf() でp値を求めて F分布に描き、最後に SST・SSB・SSW・MS・F を手計算で出す方法を学びます。 ·", "easy": "stats/m5_anova_calc_easy.html", "practice": false}, {"id": "stats/m5_anova_post.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "🔍", "title": "ANOVA③：事後検定（Tukey HSD・Bonferroni）", "tag": "M5 · ANOVA ③ — Post Hoc Tests: Tukey HSD &amp; Bonferroni", "desc": "ANOVA で「どこかに差がある」と分かったら、次は「どのグループとどのグループが違うのか」。それを調べるのが事後検定（post hoc test）です。 ·", "easy": "stats/m5_anova_post_easy.html", "practice": false}, {"id": "stats/m5_chi_gof.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "🎲", "title": "χ²①：適合度検定（Goodness-of-Fit Test）", "tag": "M5 · Chi-square ① — Goodness-of-Fit Test", "desc": "カテゴリ（区分）ごとの度数が、「こうなるはず」という割合にうまく当てはまるかを調べるのがχ²適合度検定です。仮説の立て方、期待度数、手計算、p値、結論の書き方、そしてRでの実行までを、NHL選手の誕生日と広告の人種の割合という2つの例… ·", "easy": "stats/m5_chi_gof_easy.html", "practice": false}, {"id": "stats/m5_chi_two.html", "course": "stats", "mod": "550 M5 t・ANOVA・χ²", "icon": "📋", "title": "χ²②：二元表と独立性の検定", "tag": "M5 · Chi-square ② — Two-way Tables &amp; Test of Independence", "desc": "カテゴリ変数が2つになったら二元表。怒りと心臓病の実データで、期待度数の計算から chisq.test()、条件の確認、結論と Type I error までを通して学び、生データからの検定と3つのχ²検定のまとめまでやります。 ·", "easy": "stats/m5_chi_two_easy.html", "practice": false}, {"id": "stats/m6_corr_basics.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "📈", "title": "相関①：散布図と相関係数 r", "tag": "M6 · Correlation ① — Scatterplots &amp; the Correlation Coefficient", "desc": "2つの量的変数の関係は、まず散布図で見て、向き・形・強さ・特異な特徴を言葉にします。そのあと、強さと向きを1つの数で表す相関係数 r を学び、実データ（donors）で探索し、相関行列・散布図行列で多くの変数を一度に眺めます。 ·", "easy": "stats/m6_corr_basics_easy.html", "practice": false}, {"id": "stats/m6_corr_calc.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "🧮", "title": "相関②：手計算と注意点", "tag": "M6 · Correlation ② — How r is calculated, and its cautions", "desc": "相関係数 r はどう計算されるのか。共分散（covariance）を標準化したものが r です。電卓でも手計算できる小さな例を通して意味をつかみ、そのあとで r の性質と、使うときの注意点（因果・曲線・外れ値・カテゴリ変数）を学びます。 ·", "easy": "stats/m6_corr_calc_easy.html", "practice": false}, {"id": "stats/m6_reg_intro.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "📉", "title": "回帰①：回帰直線と最小二乗法", "tag": "M6 · Linear Regression — Line of Best Fit", "desc": "相関 r は2つの変数の関係の強さを1つの数にしました。ここからは一歩進んで、x から y を予測する直線を引きます。「なぜその直線が最良なのか？」を、残差と最小二乗法で説明します。 ·", "easy": "stats/m6_reg_intro_easy.html", "practice": false}, {"id": "stats/m6_reg_interpret.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "🔍", "title": "回帰②：係数の読み方・残差プロット・R²", "tag": "M6 · Linear Regression ② — Coefficients, Residual Plots, R²", "desc": "回帰直線ができたら、次は読む番です。切片と傾きが何を意味するか、そのモデルは適切か（残差プロット）、そしてどれだけ良いか（R²）を、寄付者データ（donors）で確かめます。 ·", "easy": "stats/m6_reg_interpret_easy.html", "practice": false}, {"id": "stats/m6_reg_inference.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "🎯", "title": "回帰③：傾きの推測（信頼区間と検定）", "tag": "M6 · Linear Regression — Inference for the Slope", "desc": "標本から求めた傾き b は、標本が変われば変わります。では母集団の本当の傾き βについて、何が言えるでしょうか。信頼区間で「どのあたりか」を推定し、有意性検定で「関連があると言えるか」を判断します。 ·", "easy": "stats/m6_reg_inference_easy.html", "practice": false}, {"id": "stats/m6_reg_more.html", "course": "stats", "mod": "550 M6 相関・回帰", "icon": "🧩", "title": "回帰④：カテゴリ変数と重回帰", "tag": "M6 · Correlation &amp; Linear Regression — Categorical Predictors &amp; Multiple Regression", "desc": "ここまでの回帰は「数値の説明変数 1 つ」でした。この回では 2 つ拡張します。①性別や居住地のような「カテゴリ」でも予測できること、②説明変数を複数入れる「重回帰」です。最後に M6 全体（相関 → 回帰 → 推測 → 拡張）を振り… ·", "easy": "stats/m6_reg_more_easy.html", "practice": fals pe", "desc": "複数の動詞をつなぐパイプ。なぜ便利か、どう書けば読みやすいか（スタイル9か条）を整理します。", "easy": null, "practice": false}, {"id": "r650/m2_groups.html", "course": "r650", "mod": "M2 取込・dplyr", "icon": "🗂️", "title": "グループ集計（group_by / summarise / .by）", "tag": "M2 · Groups", "desc": "「月ごとの平均遅れ」のようにグループ別に要約するのが group_by と summarise。平均と件数だけで驚くほど多くのことがわかります。", "easy": null, "practice": false}, {"id": "r650/na_missing.html", "course": "r650", "mod": "欠損値・外れ値", "icon": "🕳️", "title": "欠損値（NA）の扱い方", "tag": "データ整備 · Missing values", "desc": "現実のデータには必ず穴（NA）があります。数え方、drop_na() の危険、そして「消すより補う」補完（imputation）を学びます。", "easy": null, "practice": false}, {"id": "r650/na_outliers.html", "course": "r650", "mod": "欠損値・外れ値", "icon": "🚨", "title": "外れ値の見つけ方（1.5IQR と 3SD）", "tag": "データ整備 · Outliers", "desc": "極端な値（外れ値）をどう判定し、消すかどうかをどう決めるか。1.5×IQR ルールと 3SD ルールの違いを、赤ちゃんの体重で確かめます。", "easy": null, "practice": false}, {"id": "r650/cor_basics.html", "course": "r650", "mod": "相関", "icon": "🔗", "title": "相関の考え方（データの型・r の性質）", "tag": "相関 · Basics", "desc": "変数の型でグラフと要約を選び、2つの数値変数の関係を相関係数 r で測ります。サッカーのパワー指数（SPI）データで学びます。", "easy": null, "practice": false}, {"id": "r650/cor_r.html", "course": "r650", "mod": "相関", "icon": "🧮", "title": "R で相関を求める・可視化する", "tag": "相関 · In R", "desc": "cor() と cor.test()、NA の扱い、相関行列、そして corrgram / DataExplorer による可視化まで。", "easy": null, "practice": false}, {"id": "r650/m4_predict.html", "course": "r650", "mod": "M4 単回帰", "icon": "🔮", "title": "単回帰で予測する（手計算と predict）", "tag": "M4 · Prediction", "desc": "モデルは理解と予測のために作ります。回帰式 Ŷ = a + bX に気温を入れて、レンタル台数を予測する方法を2通りで学びます。", "easy": null, "practice": false}, {"id": "r650/m4_intervals.html", "course": "r650", "mod": "M4 単回帰", "icon": "📏", "title": "信頼区間と予測区間（CI と PI）", "tag": "M4 · Intervals", "desc": "予測値（点推定）には誤差の幅があります。「平均」を推定する信頼区間と、「ある1日」を予測する予測区間の違いを理解します。", "easy": null, "practice": false}, {"id": "r650/m4_assump.html", "course": "r650", "mod": "M4 単回帰", "icon": "✅", "title": "回帰の仮定を点検する", "tag": "M4 · Assumptions", "desc": "線形回帰で推測（信頼区間・検定）をするときに確かめる条件：線形性、残差の平均0、正規性、等分散、独立性。図と数値で調べます。", "easy": null, "practice": false}, {"id": "r650/m4_nonnormal.html", "course": "r650", "mod": "M4 単回帰", "icon": "🧪", "title": "仮定が崩れたら（検定と対処法）", "tag": "M4 · Violations", "desc": "仮定が満たされないとき、どうするか？その前に「分析の目的」を考えます。そして正規性・等分散を検定する Shapiro-Wilk、Kolmogorov-Smirnov、Breusch-Pagan を整理します。", "easy": null, "practice": false}, {"id": "r650/m5_ch1.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "📈", "title": "重回帰分析（Multiple Regression）", "tag": "M5 · 1章", "desc": "1つの手がかりだけで予測するのが「単回帰」。複数の手がかりを同時に使うのが「重回帰」。自転車レンタル数を例に、モデルの作り方と予測の仕方をゼロから学ぶ。", "easy": "r650/m5_ch1_easy.html", "practice": false}, {"id": "r650/m5_ch2.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🩺", "title": "診断（Diagnostics）", "tag": "M5 · 2章", "desc": "モデルは作れた。でも「これは良いモデル？」を、どう判断する？1つの指標に頼らず、調整済みR²・AIC・BIC・S・RMSE・F統計量・MallowのCpを総合的に見る方法を学ぶ。", "easy": "r650/m5_ch2_easy.html", "practice": false}, {"id": "r650/m5_ch3.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "⚖️", "title": "標準化回帰係数", "tag": "M5 · 3章", "desc": "湿度・気温・風速は単位がバラバラ。係数の大きさをそのまま比べても「どれが一番効いているか」はわからない。単位をそろえて公平に比べる方法を学ぶ。", "easy": "r650/m5_ch3_easy.html", "practice": false}, {"id": "r650/m5_ch3_1.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🎯", "title": "影響点分析（Influential Points）", "tag": "M5 · 3.1章", "desc": "「外れ値」と「影響点」は別もの。回帰線を大きくゆがめる“悪い影響を与える点”を、クックの距離（Cook's D）で自動的に見つける方法を学ぶ。", "easy": "r650/m5_ch3_1_easy.html", "practice": false}, {"id": "r650/m5_ch4.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🔗", "title": "多重共線性とVIF", "tag": "M5 · 4章", "desc": "予測変数どうしが「似すぎている」と、係数がおかしくなる。相関行列では見抜けない隠れた共線性を、分散拡大係数（VIF）で検出する方法を学ぶ。", "easy": "r650/m5_ch4_easy.html", "practice": false}, {"id": "r650/m5_ch5.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "〰️", "title": "多項式回帰（Polynomial Regression）", "tag": "M5 · 5章", "desc": "線形回帰は「直線の関係」を前提にする。でも気温とレンタル数は“ある気温まで増えて、暑すぎると減る”曲線。直線では捉えられない関係を扱う方法を学ぶ。", "easy": "r650/m5_ch5_easy.html", "practice": false}, {"id": "r650/m5_ch6.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🏷️", "title": "カテゴリ変数の変換", "tag": "M5 · 6章", "desc": "「季節＝1」「曜日＝2」…数字で表されたカテゴリ。そのまま使うと意味がわからないし、特定の季節だけ取り除くこともできない。factor化とワンホットエンコーディングで解決する。", "easy": "r650/m5_ch6_easy.html", "practice": false}, {"id": "r650/m5_ch7.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "📅", "title": "日付データの処理", "tag": "M5 · 7章", "desc": "「8月」と「5月」では自転車のレンタル数が違う。1つの日付列から年・月・日を取り出して、分析に使えるようにする方法を学ぶ。", "easy": "r650/m5_ch7_easy.html", "practice": false}, {"id": "r650/m5_ch8.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "✖️", "title": "交互作用（Interaction）", "tag": "M5 · 8章", "desc": "運動だけ、食事だけでもコレステロールは下がる。でも両方を組み合わせると、効果は単なる足し算以上になる。2変数の「組み合わせ効果」をモデルに入れる方法を学ぶ。", "easy": "r650/m5_ch8_easy.html", "practice": false}, {"id": "r650/m5_ch9.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "➡️", "title": "変数選択：前進選択（Forward）", "tag": "M5 · 9章", "desc": "20個の予測変数があると、組み合わせは100万通り以上。全部試すのは無理。「何もない状態」から最良の変数を1つずつ足していく、賢い選び方を学ぶ。", "easy": "r650/m5_ch9_easy.html", "practice": false}, {"id": "r650/m5_ch10.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "⬅️", "title": "変数選択：後退選択（Backward）", "tag": "M5 · 10章", "desc": "前進選択が「空から足す」なら、後退選択は「全部入りから削る」。最も役立たない予測変数を1つずつ取り除いていく、もう一つの賢い変数選択法を学ぶ。", "easy": "r650/m5_ch10_easy.html", "practice": false}, {"id": "r650/m5_ch11.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🔀", "title": "ステップワイズ＆階層的選択", "tag": "M5 · 11章", "desc": "前進と後退、両方を同時にやったら？それがステップワイズ。さらに、専門知識（ドメイン知識）に基づいて変数を入れる順番を決める「階層的選択」も学ぶ。", "easy": "r650/m5_ch11_easy.html", "practice": false}, {"id": "r650/m5_ch12.html", "course": "r650", "mod": "M5 重回帰分析", "icon": "🎓", "title": "モデル性能の評価（Evaluating Performance）", "tag": "M5 · 12章", "desc": "モデルは作れた。でも「見たことのない新しいデータでもうまくいく？」が本当の問い。訓練・テスト分割で「汎化（はんか）」を確かめ、過学習を見抜く方法を学ぶ。最終章！", "easy": "r650/m5_ch12_easy.html", "practice": false}, {"id": "r650/m6_ch1.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "🎲", "title": "ロジスティック回帰とは？", "tag": "M6 · 1章", "desc": "M5で学んだ重回帰との違いは「何を予測するか」。バイナリ結果・確率・glm()の基礎をアバロンデータで学ぶ。", "easy": "r650/m6_ch1_easy.html", "practice": false}, {"id": "r650/m6_ch2.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "📐", "title": "ロジスティック回帰モデルの仕組み", "tag": "M6 · 2章", "desc": "係数を理解するために必須の3変換：確率・オッズ・対数オッズの関係を完全マスターする。", "easy": "r650/m6_ch2_easy.html", "practice": false}, {"id": "r650/m6_ch3.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "🔑", "title": "ロジスティック回帰のカギ：変換を理解する", "tag": "M6 · 3章", "desc": "確率→オッズ→対数オッズの変換をグラフと手計算で完全理解。シグモイド関数で元に戻る仕組みも確認。", "easy": "r650/m6_ch3_easy.html", "practice": false}, {"id": "r650/m6_ch4.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "🐚", "title": "係数の解釈：アバロンの例", "tag": "M6 · 4章", "desc": "予測変数なしモデルの切片が対数オッズであることを、アバロンの実データで手計算しながら確認。係数→確率への変換を完全マスター。", "easy": "r650/m6_ch4_easy.html", "practice": false}, {"id": "r650/m6_ch5.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "📉", "title": "モデル評価①：逸脱度（Deviance）", "tag": "M6 · 5章", "desc": "対数尤度・逸脱度（−2LL）・ヌル逸脱度vs残差逸脱度・カイ二乗検定でモデルを評価する方法を学ぶ。", "easy": "r650/m6_ch5_easy.html", "practice": false}, {"id": "r650/m6_ch6.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "📊", "title": "モデル評価②：AIC", "tag": "M6 · 6章", "desc": "AIC = −2LL + 2K。予測変数追加のペナルティがある点が逸脱度との違い。2モデルをAICで比較する。", "easy": "r650/m6_ch6_easy.html", "practice": false}, {"id": "r650/m6_ch7.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "🔧", "title": "RでAICを使う：2つのKに注意", "tag": "M6 · 7章", "desc": "RのAIC()関数の引数kと数式のKの違い。デフォルトk=2が古典的AIC。NYCフライトデータで動作を確認。", "easy": "r650/m6_ch7_easy.html", "practice": false}, {"id": "r650/m6_ch8.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "📏", "title": "モデル評価③：Z値とR²", "tag": "M6 · 8章", "desc": "個別の予測変数はZ統計量（係数÷SE）で評価。ロジスティック回帰にR²は存在しない理由と代替指標を理解する。", "easy": "r650/m6_ch8_easy.html", "practice": false}, {"id": "r650/m6_ch9.html", "course": "r650", "mod": "M6 ロジスティック回帰", "icon": "🏦", "title": "応用例：ドイツ信用データ", "tag": "M6 · 9章", "desc": "caretパッケージのGermanCreditデータを使ってロジスティック回帰を実践。目的変数の確認・切片の解釈・次のステップを学ぶ。", "easy": "r650
